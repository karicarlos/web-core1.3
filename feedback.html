<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обратная связь</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body class="body-contain">
    <div class="overlay">
    </div>
        <aside class="feedback">
            <header class="header-btn">
                <button class="button button_close">
                    <img class="button__close" src="pictue/close.svg" alt="Close">
                </button>
            <div class="connect">
                <h2 class="connect__title">Обратная связь</h2>
            </div>
            <form>
                <input type="name" id="name" name="name" placeholder="Имя"><br>
                <input type="number" id="number" name="number" placeholder="Телефон"><br>
                <input type="email" id="email" name="email" placeholder="Электронная почта"><br>
                <input type="message" id="message" name="message" placeholder="Сообщение"><br>
                <p class="information">Нажимая “отправить”, вы даете согласие<br> на <a class="info" href="#">обработку персональных данных</a> и<br> соглашаетесь с нашей <a class="info-two" href="#">политикой конфиденциальности"</a></p>
            </form>
            <button class="button button_send">
                        <span class="send">ОТПРАВИТЬ</span>
            </button>
        </aside>
    </body>
</html>
