<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiper - Ремонт Техники</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body>
    <section class="devices">
        <h1 class="name">Ремонт различных видов техники</h1>
      <div class="swiper-second">
        <ul class="repair-devices swiper-wrapper">
            <li class="devices__item swiper-slide">
                <span>Ремонт ноутбуков</span>
                <button class="button button_more">
                    <img class="button__more" src="pictue/more.svg" alt="Подробнее">
                </button>
            </li>
            <li class="devices__item swiper-slide">
                <span>Ремонт планшетов</span>
                <button class="button button_more">
                    <img class="button__more" src="pictue/more.svg" alt="Подробнее">
                </button>
            </li>
            <li class="devices__item swiper-slide">
                <span>Ремонт ПК</span>
                <button class="button button_more">
                    <img class="button__more" src="pictue/more.svg" alt="Подробнее">
                </button>
            </li>
            <li class="devices__item swiper-slide">
                <span>Ремонт мониторов</span>
                <button class="button button_more">
                    <img class="button__more" src="pictue/more.svg" alt="Подробнее">
                </button>
            </li>
    </section>
